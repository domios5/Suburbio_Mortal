<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Jogo de sobrevivência com zombies em 3D: explora, fabrica, defende o abrigo.">
<meta name="theme-color" content="#0e171b">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>Subúrbio Morto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* Layout: cena 3D a ecrã inteiro, HUD sobreposto (topo: estado; esquerda: diário; direita: mochila; fundo: ações contextuais) */
:root{
  --ink:#0e171b; --panel:#15252c; --panel-2:#1d3139; --line:#2d4651;
  --text:#dce6e0; --dim:#8ea4a2; --ok:#6fcf9a; --warn:#e8b95c; --bad:#e0624f; --info:#7fb7d6;
  --c-hp:#e0624f; --c-hun:#e8b95c; --c-thi:#7fb7d6; --c-ene:#a995d6;
  --f-d:'Special Elite','Courier New',monospace;
  --f-b:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:500 15px/1.3 var(--f-b);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;overflow:hidden;background:var(--ink)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;pointer-events:none}
#hud[hidden]{display:none}
.panel{background:rgba(15,26,31,.84);border:1px solid var(--line);border-radius:6px}
#top{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 12px}
#top .time{display:flex;flex-direction:column;min-width:96px}
#top .time b{font:400 17px var(--f-d);letter-spacing:.02em}
#top .time span{font-size:13px;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(70px,1fr));gap:8px 12px;flex:1 1 320px;min-width:0}
.bar .t{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.bar .b{height:6px;background:#0a1216;border-radius:3px;overflow:hidden;margin-top:3px}
.bar .b i{display:block;height:100%;width:50%;background:var(--c);transition:width .25s}
.meta{display:flex;flex-direction:column;font-size:13px;min-width:120px}
.meta .thr{color:var(--dim)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:5px;cursor:pointer;text-align:left}
.btn:hover:not(:disabled){border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--warn);color:#1b1405;border-color:var(--warn);font-weight:600}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn small{display:block;color:var(--dim);font-size:12px;font-weight:400}
.btn:focus-visible,.cell:focus-visible,.sc:focus-visible{outline:2px solid var(--info);outline-offset:2px}
#evt{pointer-events:none;align-self:center;background:rgba(80,20,14,.86);border:1px solid var(--bad);color:#ffd9d2;padding:6px 14px;border-radius:5px;font:400 15px var(--f-d);text-align:center}
#evt[hidden]{display:none}
#mid{flex:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-height:0}
#left{width:min(330px,56%);display:flex;flex-direction:column;gap:8px;pointer-events:none;min-height:0}
#log{width:100%;display:flex;flex-direction:column;gap:3px;pointer-events:none}
#objs{pointer-events:auto;padding:8px 10px;font-size:13.5px}
#objs[hidden]{display:none}
#objs .oh{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;background:none;border:0;width:100%;padding:0;text-align:left;font:400 13px var(--f-d);letter-spacing:.04em;color:var(--warn)}
#objs ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.ob{display:grid;grid-template-columns:16px minmax(0,1fr);gap:0 6px;align-items:start}
.ob .ck{width:11px;height:11px;border:2px solid var(--dim);border-radius:3px;margin-top:3px}
.ob.done .ck{background:var(--ok);border-color:var(--ok)}
.ob.done .ot{color:var(--dim);text-decoration:line-through}
.ob.now .ck{border-color:var(--warn)}
.ob.now .ot{font-weight:600}
.ob .oh2{grid-column:2;font-size:12.5px;color:var(--dim);margin-top:1px}
#objs .oh2{font-size:12.5px;color:var(--dim)}
#log div{background:rgba(15,26,31,.72);border-left:3px solid var(--line);padding:4px 8px;font-size:14px;border-radius:0 4px 4px 0}
#log div.bad{border-color:var(--bad)} #log div.ok{border-color:var(--ok)} #log div.warn{border-color:var(--warn)}
#log div:nth-last-child(n+4){opacity:.55}
#inv{pointer-events:auto;width:250px;max-width:46%;max-height:100%;overflow:auto;padding:10px 12px;font-size:14px}
#inv.hide{display:none}
#side{pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-height:0;max-height:100%}
#mini{pointer-events:auto;width:150px;height:150px;border:1px solid var(--line);border-radius:6px;display:block;flex:none}
#inv{flex:0 1 auto;min-height:0}
.loc{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:3px 0;border-bottom:1px solid rgba(45,70,81,.5);font-size:13px}
.loc .ld{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.loc .lr{grid-column:1/-1;font-size:12px;color:var(--dim)}
#inv h4{margin:10px 0 4px;font:400 13px var(--f-d);letter-spacing:.04em;color:var(--warn)}
#inv h4:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:2px 0}
.row .sw{width:10px;height:10px;border-radius:2px;flex:none}
.row .nm{flex:1;min-width:0}
.row b{font-variant-numeric:tabular-nums}
.row button{background:none;border:1px solid var(--line);border-radius:4px;color:var(--text);cursor:pointer;padding:0 6px;font-size:12px}
.row button:hover{border-color:var(--warn)}
.row.eq{color:var(--warn)}
.dur{height:3px;background:#0a1216;border-radius:2px;margin-top:2px}
.dur i{display:block;height:100%;background:var(--ok)}
.dev{font-size:13px;color:var(--dim)}
.dev b{color:var(--text);font-weight:500}
#bottom{display:flex;justify-content:center;align-items:flex-end}
#acts{pointer-events:auto;display:flex;flex-direction:column;gap:6px;width:min(390px,100%);max-height:42vh;overflow:auto}
#acts .hd{font:400 12px var(--f-d);color:var(--dim);letter-spacing:.05em}
#atk{pointer-events:auto;position:absolute;right:16px;bottom:18px;width:92px;height:92px;border-radius:50%;background:rgba(224,98,79,.22);border:2px solid var(--bad);font:400 15px var(--f-d);color:#ffd9d2;cursor:pointer;line-height:1.1;padding:0}
#atk small{display:block;font:500 11px var(--f-b);color:var(--dim)}
#atk:active{background:rgba(224,98,79,.5)}
#joy{display:none;position:absolute;left:16px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(220,230,224,.08);border:2px solid var(--line);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(232,185,92,.45);border:2px solid var(--warn)}
@media (pointer:coarse){#joy{display:block} #bottom{padding-bottom:132px}}
#objs .oh span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#objs .oh span:last-child{flex:none;white-space:nowrap}
#invX{display:none}
#hud,#hud *{-webkit-tap-highlight-color:transparent}
#hud button,#hud .panel{-webkit-user-select:none;user-select:none}
/* telemóvel / ecrã baixo: HUD compacto, uma linha de estado, registo curto, mochila em ecrã cheio */
@media (max-width:700px),(max-height:540px){
  #hud{gap:6px;padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
  #top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:6px 8px;align-items:center}
  #top .time{grid-area:1/1;flex-direction:column;min-width:0}
  #top .time b{font-size:15px;line-height:1.1}
  #top .time span{font-size:12px;line-height:1.15}
  #top .time .ph{display:none}
  #top .tools{grid-area:1/2;gap:4px;flex-wrap:nowrap}
  #top .tools .btn{padding:6px 9px;font-size:13px;text-align:center}
  #sndBtn,#helpBtn{display:none}
  .stats{grid-area:2/1/3/3;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:none}
  .bar .t{font-size:10px;letter-spacing:.04em}
  .bar .b{height:5px;margin-top:2px}
  .meta{grid-area:3/1/4/3;flex-direction:row;flex-wrap:wrap;gap:0 10px;min-width:0;font-size:12px}
  #evt{font-size:12.5px;padding:4px 10px}
  #left{width:min(330px,64%)}
  #objs{padding:6px 8px;font-size:12.5px}
  #objs .oh{font-size:12px}
  #objs ul{max-height:36vh;overflow:auto}
  #log div{font-size:12.5px;padding:3px 7px}
  #mini{width:86px;height:86px}
  #inv{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:auto;max-width:none;max-height:72%;z-index:3;font-size:14px}
  #invX{display:block;width:100%;margin-bottom:8px;text-align:center}
  #acts{width:100%;max-height:34vh;gap:5px}
  #acts .btn{padding:7px 10px}
  #acts .btn small{font-size:11.5px}
  #atk{width:80px;height:80px;right:max(12px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));font-size:14px}
  #joy{width:104px;height:104px;left:max(12px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}
  #joy i{width:42px;height:42px;margin:-21px 0 0 -21px}
  .m{padding:14px}
  .m h2{font-size:22px}
}
@media (pointer:coarse) and (max-width:700px){#bottom{padding-bottom:124px}}
/* telemóvel na horizontal: barra de topo numa só linha */
@media (max-height:540px) and (min-width:560px){
  #top{grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px}
  #top .time{grid-area:1/1;flex-direction:row;align-items:baseline;gap:8px}
  .stats{grid-area:1/2}
  #top .tools{grid-area:1/3}
  .meta{display:none}
  #bottom{padding-bottom:0}
  #acts{width:min(360px,46%);max-height:46vh}
  #inv{max-height:80%}
}
#modal{position:absolute;inset:0;background:rgba(5,10,13,.8);display:grid;place-items:center;padding:16px;overflow:auto;z-index:10}
#modal[hidden]{display:none}
.m{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;width:100%;max-width:780px;max-height:100%;overflow:auto;margin:auto}
.m h2{margin:0 0 4px;font:400 26px var(--f-d);letter-spacing:.01em;text-wrap:balance}
.m h3{margin:14px 0 6px;font:400 15px var(--f-d);color:var(--warn);letter-spacing:.04em}
.m p{margin:6px 0;color:var(--text);max-width:68ch}
.m .dim{color:var(--dim)}
.m .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.sc{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left;cursor:pointer;min-width:0}
.sc.on{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.sc h4{margin:0 0 2px;font:400 16px var(--f-d)}
.sc .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}
.sc ul{list-style:none;margin:6px 0 0;padding:0;font-size:13.5px}
.sc li{padding-left:16px;position:relative;margin:2px 0}
.sc li.p::before{content:"+";position:absolute;left:2px;color:var(--ok);font-weight:600}
.sc li.c::before{content:"\2212";position:absolute;left:2px;color:var(--bad);font-weight:600}
.cr{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px}
@media (max-width:640px){.cr{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer}
.tab.on{border-color:var(--warn);color:var(--warn)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0}
.cell{aspect-ratio:1.15;min-height:46px;border:1px dashed var(--line);border-radius:5px;background:rgba(0,0,0,.18);cursor:pointer;font-size:12px;padding:2px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim)}
.cell.f{border-style:solid;border-color:transparent;color:#10181b;font-weight:600}
.cell.g{color:rgba(232,185,92,.55);border-color:rgba(232,185,92,.35)}
.pal{display:flex;flex-direction:column;gap:5px}
.pal .it{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 8px;cursor:pointer;text-align:left}
.pal .it.on{border-color:var(--warn)}
.pal .it:disabled{opacity:.4;cursor:not-allowed}
.pal .it .sw{width:12px;height:12px;border-radius:3px;flex:none}
.pal .it span{flex:1;min-width:0}
.score{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.score b{font:400 38px var(--f-d);font-variant-numeric:tabular-nums}
.meter{height:8px;background:#0a1216;border-radius:4px;overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%;transition:width .2s}
.res{margin-top:8px;padding:8px 10px;border-radius:5px;background:rgba(0,0,0,.25);border-left:3px solid var(--warn)}
.res.bad{border-color:var(--bad)} .res.ok{border-color:var(--ok)}
.wsvg{display:block;width:100%;max-width:400px;margin:8px auto;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:6px}
.wsvg [data-a]{cursor:pointer}
.rooms{display:grid;gap:8px;margin-top:10px}
.room{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.room.done{opacity:.55}
.room .rn{font:400 16px var(--f-d)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.stat div{min-width:80px}
.stat b{display:block;font:400 26px var(--f-d)}
kbd{background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;font:500 13px var(--f-b)}
.menu-wrap{max-width:380px;margin:0 auto}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.menu .btn{text-align:center;padding:10px 14px}
.rg{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.rg span{display:flex;justify-content:space-between;gap:8px}
.rg input[type=range]{accent-color:var(--warn);width:100%;margin:4px 0}
@media (prefers-reduced-motion:reduce){.bar .b i,.meter i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud" hidden>
    <div id="top" class="panel">
      <div class="time"><b id="dayN">Dia 1</b><span><span id="clk">08:00</span><span class="ph"> · <span id="phase">Manhã</span></span></span></div>
      <div class="stats" id="stats"></div>
      <div class="meta"><span id="lvl">Nível 1</span><span class="thr" id="thr">Ameaça: calma</span></div>
      <div class="tools">
        <button class="btn" id="sndBtn" type="button" aria-pressed="false">Som</button>
        <button class="btn" id="pauseBtn" type="button">Pausa</button>
        <button class="btn" id="spd" type="button">Tempo ×1</button>
        <button class="btn" id="invBtn" type="button">Mochila</button>
        <button class="btn" id="helpBtn" type="button">Ajuda</button>
      </div>
    </div>
    <div id="evt" hidden></div>
    <div id="mid">
      <div id="left"><div id="objs" class="panel" hidden></div><div id="log" aria-live="polite"></div></div>
      <div id="side"><canvas id="mini" width="300" height="300" aria-label="Mapa"></canvas><div id="inv" class="panel"><button class="btn" id="invX" type="button">Fechar mochila</button><div id="invMain"></div><div id="locs"></div></div></div>
    </div>
    <div id="bottom"><div id="acts"></div></div>
    <button id="atk" type="button" data-nosound>Atacar<small id="atkw">Punhos</small></button>
    <div id="joy"><i id="knob"></i></div>
  </div>
  <div id="modal"><div class="m" id="mbody"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="three.min.js"><\/script>')</script>
<script>
(function(){
'use strict';
var THREE=window.THREE;
function $(s,r){return (r||document).querySelector(s);}
if(!THREE){$('#mbody').innerHTML='<h2>Motor 3D indisponível</h2><p>Não foi possível carregar o Three.js. Verifica a ligação à internet ou guarda o ficheiro three.min.js ao lado do index.html (ver README).</p>';return;}

/* ---------- utilitários ---------- */
var rand=function(a,b){return a+Math.random()*(b-a);};
var randi=function(a,b){return Math.floor(rand(a,b+1));};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var lerp=function(a,b,t){return a+(b-a)*t;};
var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
var p2=function(n){return String(n).padStart(2,'0');};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* AUDIO-START */
/* ---------- som: tudo sintetizado com Web Audio, sem ficheiros ---------- */
var SFX=(function(){
  var ctx=null,master=null,sfxBus=null,ambBus=null,noiseBuf=null,amb=null;
  var voices=[],MAXV=40,cur=null,lastAt={},acc=0,hbT=0,farT=14;
  var cfg={vol:0.7,amb:0.6,mute:false};
  var KEY='suburbio-morto-audio-v1';
  var COOL={hit:0.05,swing:0.08,step:0.2,stepIn:0.2,ui:0.03,bang:0.15,creak:0.3,zap:0.12,groan:0.45,groanFar:1,pickup:0.05,drop:0.08,shot:0.1,heartbeat:0.2,hurt:0.15};
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function R(a,b){return a+Math.random()*(b-a);}
  try{
    var raw=window.localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);
      if(typeof o.vol==='number')cfg.vol=clamp(o.vol,0,1);
      if(typeof o.amb==='number')cfg.amb=clamp(o.amb,0,1);
      cfg.mute=!!o.mute;}
  }catch(e){}
  function save(){try{window.localStorage.setItem(KEY,JSON.stringify(cfg));}catch(e){}}
  function applyGains(){
    if(!ctx||!master)return;
    var t=ctx.currentTime;
    master.gain.setTargetAtTime(cfg.mute?0:Math.pow(cfg.vol,1.6)*3.2,t,0.03);
    ambBus.gain.setTargetAtTime(cfg.amb*0.5,t,0.1);
  }
  function attach(c){
    ctx=c;amb=null;voices=[];
    master=ctx.createGain();sfxBus=ctx.createGain();ambBus=ctx.createGain();
    var comp=ctx.createDynamicsCompressor();
    try{comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=12;comp.attack.value=0.002;comp.release.value=0.2;}catch(e){}
    sfxBus.connect(master);ambBus.connect(master);master.connect(comp);comp.connect(ctx.destination);
    var len=Math.floor(ctx.sampleRate*2.5);
    noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
    var d=noiseBuf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    master.gain.value=cfg.mute?0:Math.pow(cfg.vol,1.6)*3.2;ambBus.gain.value=cfg.amb*0.5;
    applyGains();
  }
  /* ---- primitivas ---- */
  function route(bus){
    var inp=ctx.createGain();

function skyAt(h){
  for(var i=0;i<SKY.length-1;i++){

}

  g.userData.tower.visible=!!b.tower;
}

/* ---------- colisões ---------- */
function hitRect(x,z,r,b){var cx=clamp(x,b.x1,b.x2),cz=clamp(z,b.z1,b.z2),dx=x-cx,dz=z-cz;return dx*dx+dz*dz<r*r;}
function collides(x,z,r){
  var i;
  for(i=0;i<WALLS.length;i++){if(hitRect(x,z,r,WALLS[i]))return true;}
  for(i=0;i<SOLIDS.length;i++){if(hitRect(x,z,r,SOLIDS[i]))return true;}
  return false;
}
function playerInside(){return Math.abs(P.x)<HX-0.15&&Math.abs(P.z)<HZ-0.15;}

/* ---------- registo e avisos ---------- */
var logEl=$('#log');
function say(msg,cls){
  if(!S)return;
  var h=hourOf();
  S.log.push({t:p2(Math.floor(h))+':'+p2(Math.floor((h%1)*60)),m:msg,c:cls||''});
  if(S.log.length>40)S.log.shift();
  renderLog();
}
var cmq=window.matchMedia?window.matchMedia('(max-width:700px),(max-height:540px)'):null;
function compact(){return !!(cmq&&cmq.matches);}
function renderLog(){
  var last=S.log.slice(-(compact()?2:5));
  logEl.innerHTML=last.map(function(l){return '<div class="'+l.c+'">'+esc(l.t)+' · '+esc(l.m)+'</div>';}).join('');
}
function addXp(n){
  S.xp+=n;
  var need=50*S.lvl;
  while(S.xp>=need){S.xp-=need;S.lvl++;need=50*S.lvl;say('Subiste para o nível '+S.lvl+'. Os desafios vão crescer contigo.','ok');SFX.play('levelUp');checkUnlocks();}
}

/* ---------- sobrevivência ---------- */
function survival(m){
  S.hun=clamp(S.hun-2.8*m/60,0,100);
  S.thi=clamp(S.thi-3.6*m/60,0,100);
  S.ene=clamp(S.ene-2.2*m/60,0,100);
  var drain=0;
  if(S.hun<=0)drain+=2;if(S.thi<=0)drain+=2.5;if(S.ene<=0)drain+=1;
  if(drain)S.hp-=drain*m/60;
  else if(S.hun>40&&S.thi>40)S.hp=clamp(S.hp+0.6*m/60,0,100);
}
function syncDay(){
  S.day=Math.floor(S.min/1440)+1;
  if(S.day>S.lastDay){
    S.lastDay=S.day;
    if(S.day>3){addXp(20);say('Sobreviveste à noite. Amanhece o dia '+S.day+'.','ok');}
    else say('Amanhece o dia '+S.day+'.');
    S.nightKills=0;
    refreshBuildings();
    autoSave();
  }
}

/* ---------- diretor de dificuldade ---------- */
function threatBase(){return 1+Math.floor((S.day-3)/3)+Math.floor(S.lvl/3);}
function pickKind(){
  var r=Math.random();
  if(S.day>=10&&r<.12)return 'brute';
  if(S.day>=6&&r<.35)return 'runner';
  return 'walker';
}
function nextEventSorted(){
  var best=null;
  for(var d=S.day;d<S.day+16;d++){
    if(d%5===0){best={type:'Lua cheia',day:d};break;}
    if(d%7===0){best={type:'Nevoeiro denso',day:d};break;}
  }
  return best;
}
function directorStep(ctx){
  var h=hourOf(),d=S.day;
  if(d%5===0&&!S.flags['m'+d]&&h>=20){
    S.flags['m'+d]=1;
    var waves=2+Math.floor(d/5),size=3+Math.floor(S.lvl/2);
    for(var i=0;i<waves;i++)S.queue.push({at:S.min+i*28+5,n:size});
    say('Lua cheia. Uma horda vem a caminho até ao amanhecer.','bad');SFX.play('howl');
  }
  if(d%7===0&&!S.flags['f'+d]&&h>=9){
    S.flags['f'+d]=1;
    S.queue.push({at:S.min+10,n:3+Math.floor(S.lvl/2)});S.queue.push({at:S.min+7*60,n:3+Math.floor(S.lvl/2)});
    say('O nevoeiro tapou tudo. Há vultos a mexer lá fora.','bad');SFX.play('fogHorn');
  }
  S.queue.sort(function(a,b){return a.at-b.at;});
  while(S.queue.length&&S.queue[0].at<=S.min){var w=S.queue.shift();launchGroup(w.n,ctx);}
  if(d>=3&&S.min>=S.nextAttack){
    var night=isNight(h),base=threatBase();
    launchGroup(night?randi(1,base):1,ctx);
    var iv=(night?rand(110,260):rand(420,800))/Math.sqrt(noiseMul());
    S.nextAttack=S.min+iv;
  }
}
function launchGroup(n,ctx){
  var kinds=[];for(var i=0;i<n;i++)kinds.push(pickKind());
  if(ctx)abstractAttack(kinds,ctx);else spawnLive(kinds);
}
function spawnLive(kinds){
  var a0=rand(0,Math.PI*2);
  kinds.forEach(function(k,i){
    var a=a0+rand(-0.5,0.5),r=rand(22,27);
    var x=clamp(Math.cos(a)*r,-MAPR,MAPR),z=clamp(Math.sin(a)*r,-MAPR,MAPR);
    zombies.push(makeZombie(k,x,z));
  });
  SFX.play('groanFar');
  var dirs=['leste','sul','oeste','norte'];
  var dir=dirs[Math.floor(((a0+Math.PI/4)%(Math.PI*2))/(Math.PI/2))%4];
  if(S.dev.light.ok&&powered())say(kinds.length+' zombie(s) a aproximar-se pelo '+dir+'. A luz denunciou-os a tempo.','warn');
  else say('Ouves passos arrastados lá fora.','warn');
}
function abstractAttack(kinds,ctx){
  var n=kinds.length;
  var open=SIDEKEYS.filter(function(k){return S.bar[k].hp>0;});
  var side=open.length?pick(open):pick(SIDEKEYS);
  var b=S.bar[side];
  var power=kinds.reduce(function(s,k){return s+(k==='brute'?3:1);},0);
  var note=[];
  if(b.barrel>0&&power>=2){b.barrel--;power=Math.max(0,power-4);note.push('um barril explodiu');}
  if(b.tower&&b.ammo>=3){b.ammo-=3;power=Math.max(0,power-2);note.push('a torre disparou');}
  if(b.fence&&powered()&&power>0){power=Math.max(0,power-Math.ceil(power*0.4));note.push('a cerca elétrica travou alguns');}
  var dmg=power*randi(10,20);
  if(b.wire>0&&power>0){var ab=Math.min(b.wire,power*8);b.wire-=ab;dmg-=ab;note.push('o arame farpado absorveu o impacto');}
  var used=Math.min(b.trap,power);
  b.trap-=used;dmg-=used*12;
  if(b.alarm&&ctx.sleeping){dmg*=0.7;note.push('o alarme de latas acordou-te a tempo');}
  var was=b.hp;
  b.hp=clamp(b.hp-Math.max(0,dmg),0,b.max);
  if(note.length)say('Defesas: '+note.join(', ')+'.','ok');
  updateBarVisual(side);
  if(b.hp<=0){
    if(ctx.sleeping){
      var hurt=power*randi(5,9);S.hp-=hurt;ctx.woke=true;
      SFX.play('barBreak',{vol:0.9});SFX.play('hurt');say('Acordas com zombies dentro do abrigo ('+SIDES[side].nome+' aberta). Perdes '+hurt+' de saúde.','bad');
    }else if(was>0){

function advanceStep(m,ctx){
  S.min+=m;survival(m);

function advanceMinutes(total,ctx){

/* ---------- zombies 3D ---------- */
var drops=[],towerCd={},alarmCd={};
var CARRY=[['comida',20,1,2],['agua',18,1,2],['ligadura',12,1,1],['pregos',12,2,5],['sucata',10,1,3],['fita',6,1,2],['pecas',6,1,1],['arame',5,1,2],['bateria',4,1,1],['polvora',3,1,1],['combustivel',4,1,2]];
function rollCarry(kind,x,z){
  var far=Math.hypot(x||0,z||0);
  var ch=(kind==='brute'?0.6:kind==='runner'?0.18:0.24)*(1+far/90);
  if(Math.random()>ch)return null;
  var loot={},rolls=kind==='brute'?3:randi(1,2),total=CARRY.reduce(function(a,c){return a+c[1];},0);
  for(var i=0;i<rolls;i++){
    var r=Math.random()*total,c=CARRY[0];
    for(var j=0;j<CARRY.length;j++){r-=CARRY[j][1];if(r<=0){c=CARRY[j];break;}}
    loot[c[0]]=(loot[c[0]]||0)+randi(c[2],c[3]);
  }
  if(Math.random()<0.04){var lk=Object.keys(BP).filter(function(id){return S&&!S.unl[id];});if(lk.length)loot._bp=pick(lk);}
  return loot;
}
function applyLoot(l){
  var parts=[];
  Object.keys(l).forEach(function(k){
    if(k==='_bp'){if(!S.unl[l._bp]){unlockBp(l._bp,'planta encontrada num zombie');parts.push('uma planta');}return;}
    S.inv[k]+=l[k];parts.push('+'+l[k]+' '+ITEMS[k].s.toLowerCase());
  });
  return parts.join(', ');
}

}
function clearDrops(){drops.forEach(function(d){scene.remove(d.m);});drops=[];}
function dropsStep(dt){

function towerStep(dt){

function updateZombies(dt){
  var inside=playerInside();
  for(var i=zombies.length-1;i>=0;i--){
    var z=zombies[i];
    if(z.dead){
      z.t+=dt;z.mesh.rotation.x=-Math.min(1,z.t*3)*Math.PI/2;z.mesh.position.y=Math.min(1,z.t*3)*0.25;
      if(z.t>2.6){scene.remove(z.mesh);zombies.splice(i,1);}
      continue;
    }
    z.cd=Math.max(0,z.cd-dt);z.flash=Math.max(0,z.flash-dt);
    var pd=Math.hypot(P.x-z.x,P.z-z.z);
    if(pd<22&&Math.random()<dt*0.12){var gp=snd(z.x,z.z);gp.kind=z.kind;SFX.play('groan',gp);}
    var breach=SIDEKEYS.filter(function(k){return S.bar[k].hp<=0;});
    if(inside&&breach.length&&S.bar[z.side].hp>0&&z.stage===0){
      var bs=breach[0],bdist=1e9;
      breach.forEach(function(k){var o=SIDES[k].out,d=Math.hypot(o[0]-z.x,o[1]-z.z);if(d<bdist){bdist=d;bs=k;}});
      z.side=bs;
    }
    var bar=S.bar[z.side],sd=SIDES[z.side],tx,tz,mode;
    if(!inside&&pd<9){tx=P.x;tz=P.z;mode='p';}
    else if(bar.hp>0&&z.stage===0){
      tx=sd.out[0]+(sd.tan==='x'?z.off:0);tz=sd.out[1]+(sd.tan==='z'?z.off:0);mode='b';
    }else if(z.stage===0){
      tx=sd.inn[0];tz=sd.inn[1];mode='i';
    }else{tx=P.x;tz=P.z;mode='p';}
    var dx=tx-z.x,dz=tz-z.z,dist=Math.hypot(dx,dz);
    var speedMul=1;
    if(S.spot&&powered()&&Math.hypot(z.x,z.z)<16)speedMul=0.7;
    if(bar.alarm&&mode==='b'&&!z.alarmed&&dist<14){z.alarmed=true;alarmNotify(z.side);}
    if(mode==='b'&&dist<0.5){
      bar.hp-=z.bdmg*dt;z.bt=(z.bt||0)+dt;if(z.bt>1.1){z.bt=0;SFX.play(Math.random()<0.5?'bang':'creak',snd(z.x,z.z));}defenseHit(z,bar,dt);if(z.dead)continue;
      if(!z.trapped&&bar.trap>0){
        bar.trap--;z.trapped=true;hitZombie(z,5);fx(z.x,z.z,0xe8b95c,0.5);updateBarVisual(z.side);
        say('A armadilha de espinhos apanhou um zombie.','ok');
        if(z.dead)continue;
      }
      if(bar.hp<=0){bar.hp=0;SFX.play('barBreak',snd(z.x,z.z));say(SIDES[z.side].nome+' cedeu!','bad');}
      updateBarVisual(z.side);
      z.mesh.rotation.y=Math.atan2(sd.cen[0]-z.x,sd.cen[1]-z.z);
      z.armL.rotation.x=z.armR.rotation.x=-0.5+Math.sin(performance.now()/90+z.ph)*0.5;
    }else if(dist>0.08){
      var st=Math.min(dist,z.spd*dt*speedMul);
      z.x+=dx/dist*st;z.z+=dz/dist*st;
      z.mesh.rotation.y=Math.atan2(dx,dz);
      if(mode==='i'&&dist<0.6)z.stage=1;
      var ph=performance.now()/(z.kind==='runner'?110:210)+z.ph;
      z.legL.rotation.x=Math.sin(ph)*0.6;z.legR.rotation.x=-Math.sin(ph)*0.6;
      z.armL.rotation.x=z.armR.rotation.x=-0.2;
    }else if(mode==='i')z.stage=1;
    if(mode==='p'&&pd<1.05&&z.cd<=0){
      z.cd=1.4;S.hp-=z.dmg;S.hurt=0.35;SFX.play('hurt');
      z.mesh.rotation.y=Math.atan2(P.x-z.x,P.z-z.z);
      say(ZK[z.kind].n+' atingiu-te ('+z.dmg+').','bad');
    }
    z.mesh.position.x=z.x;z.mesh.position.z=z.z;
    z.mesh.position.y=Math.abs(Math.sin(performance.now()/200+z.ph))*0.05;
    z.body.material.emissive.setHex(z.flash>0?0xaa2222:0x000000);
  }
}

function wanderSpawn(dt){

/* ---------- jogador ---------- */
function movePlayer(dt){
  var ix=0,iz=0;
  if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
  if(keys.w||keys.arrowup)iz+=1;if(keys.s||keys.arrowdown)iz-=1;
  ix+=joy.x;iz+=-joy.y;
  var mag=Math.hypot(ix,iz);
  var f=[-Math.sin(cam.yaw),-Math.cos(cam.yaw)],r=[Math.cos(cam.yaw),-Math.sin(cam.yaw)];
  var mx=0,mz=0;
  if(mag>0.05){
    if(mag>1){ix/=mag;iz/=mag;}
    mx=f[0]*iz+r[0]*ix;mz=f[1]*iz+r[1]*ix;P.tx=null;
  }else if(P.tx!==null){
    var dx=P.tx-P.x,dz=P.tz-P.z,d=Math.hypot(dx,dz);
    if(d<0.2){P.tx=null;}else{mx=dx/d;mz=dz/d;}
  }
  if(mx||mz){
    var sp=4.2*dt,nx=P.x+mx*sp,nz=P.z+mz*sp,rad=0.35;
    var moved=false;
    if(!collides(nx,P.z,rad)){P.x=nx;moved=true;}
    if(!collides(P.x,nz,rad)){P.z=nz;moved=true;}
    if(!moved&&P.tx!==null)P.tx=null;if(moved){stepAcc+=sp;if(stepAcc>1.3){stepAcc=0;SFX.play(playerInside()?'stepIn':'step');}}
    P.face=Math.atan2(mx,mz);
  }
  P.x=clamp(P.x,-MAPR,MAPR);P.z=clamp(P.z,-MAPR,MAPR);
  playerMesh.position.set(P.x,0,P.z);
  var dr=P.face-playerMesh.rotation.y;while(dr>Math.PI)dr-=Math.PI*2;while(dr<-Math.PI)dr+=Math.PI*2;
  playerMesh.rotation.y+=dr*Math.min(1,dt*12);
  playerMesh.position.y=(mx||mz)?Math.abs(Math.sin(performance.now()/120))*0.06:0;
  if(targetMark){targetMark.visible=P.tx!==null;if(P.tx!==null)targetMark.position.set(P.tx,0.06,P.tz);}
}
function attack(){

  if(!st.def)return;

  if(d.wire.length&&b.wire<150)acts.push({l:'Instalar arame farpado',s:'+'+Math.max.apply(null,d.wire)+' de resistência · agora '+Math.round(b.wire),f:function(){installDef('wire',k);}});
  if(d.alarm.length&&!b.alarm)acts.push({l:'Pendurar alarme de latas',s:'Avisa quando algo se aproxima',f:function(){installDef('alarm',k);}});
  if(d.barrel.length&&b.barrel<2)acts.push({l:'Colocar barril incendiário',s:'Explode quando a horda chega · agora '+b.barrel+'/2',f:function(){installDef('barrel',k);}});
  if(d.fence.length&&!b.fence)acts.push({l:'Instalar cerca elétrica',s:'Minijogo de fiação · precisa do gerador ligado',f:function(){installFence(k);}});
  if(d.tower.length&&!b.tower)acts.push({l:'Montar torre de vigia',s:'Dispara sozinha até acabar a munição',f:function(){installDef('tower',k);}});
  if(b.tower)acts.push({l:'Recarregar torre',s:b.ammo+'/18 disparos · 1 sucata + 1 tábua → +6',d:b.ammo>=18||(st.inv.sucata||0)<1||(st.inv.madeira||0)<1,f:function(){reloadTower(k);}});
  if(b.wire>0)parts.push('arame '+Math.round(b.wire));
  if(b.alarm)parts.push('alarme');
  if(b.barrel>0)parts.push(b.barrel+' barril(is)');
  if(b.fence)parts.push('cerca elétrica');
  if(b.tower)parts.push('torre ('+b.ammo+')');
  acts.push({l:'Defesas deste lado',s:parts.length?parts.join(' · '):'nenhuma instalada',d:true,f:function(){}});
}
function installDef(type,k){
  var b=S.bar[k],d=S.def[type];if(!d.length)return;
  var v=takeBest(d),nm=SIDES[k].nome.toLowerCase();
  if(type==='wire'){b.wire=Math.min(150,b.wire+v);say('Arame farpado instalado em '+nm+'.','ok');}
  else if(type==='alarm'){b.alarm=true;say('Alarme de latas pendurado em '+nm+'.','ok');}
  else if(type==='barrel'){b.barrel=Math.min(2,b.barrel+1);say('Barril incendiário colocado em '+nm+'.','ok');}
  else if(type==='tower'){b.tower=true;b.ammo=Math.min(18,b.ammo+v);say('Torre de vigia montada em '+nm+' ('+b.ammo+' disparos).','ok');}
  updateBarVisual(k);markObj('reinforce');SFX.play('hammer');addXp(5);
}
function reloadTower(k){
  var b=S.bar[k];if(!b.tower||S.inv.sucata<1||S.inv.madeira<1||b.ammo>=18)return;
  S.inv.sucata--;S.inv.madeira--;b.ammo=Math.min(18,b.ammo+6);SFX.play('reload');
  say('Torre recarregada: '+b.ammo+' disparos.');
}
function installFence(k){
  if(!S.def.fence.length)return;
  openWire('fence',{nome:'Cerca elétrica',onWin:function(){
    takeBest(S.def.fence);S.bar[k].fence=true;updateBarVisual(k);SFX.play('zap');
    say('Cerca elétrica ligada em '+SIDES[k].nome.toLowerCase()+'. Precisa do gerador ligado.','ok');
  }});
}
function installSpot(){
  if(!S.def.spot.length||S.spot)return;
  takeBest(S.def.spot);S.spot=true;SFX.play('hammer');say('Holofote instalado no poste de luz.','ok');
}

  });
  BLD.forEach(function(b){

var miniC=$('#mini'),mg=miniC.getContext('2d');
function drawMini(){
  var W=miniC.width,cx=W/2,k=(W/2-12)/MAPR;
  mg.clearRect(0,0,W,W);
  mg.fillStyle='rgba(15,26,31,.88)';mg.fillRect(0,0,W,W);
  mg.strokeStyle='rgba(143,164,162,.22)';mg.lineWidth=1;
  [24,48].forEach(function(r){mg.beginPath();mg.arc(cx,cx,r*k,0,Math.PI*2);mg.stroke();});
  mg.beginPath();mg.moveTo(cx,8);mg.lineTo(cx,W-8);mg.moveTo(8,cx);mg.lineTo(W-8,cx);mg.stroke();
  mg.fillStyle='rgba(143,164,162,.2)';mg.fillRect(8,cx+17*k-3,W-16,6);
  BLD.forEach(function(b){
    var x=cx+b.cx*k,y=cx+b.cz*k,w=Math.max(8,b.hx*2*k),h=Math.max(8,b.hz*2*k);
    var ex=!S.bld[b.id].rooms.some(function(r){return !r.done;});
    mg.strokeStyle=riskCol(b);mg.fillStyle=riskCol(b);mg.lineWidth=3;
    if(ex){mg.globalAlpha=.5;mg.strokeRect(x-w/2,y-h/2,w,h);mg.globalAlpha=1;}
    else mg.fillRect(x-w/2,y-h/2,w,h);
  });
  mg.fillStyle='#dce6e0';mg.fillRect(cx-6,cx-5,12,10);
  var px=cx+P.x*k,py=cx+P.z*k;
  mg.save();mg.translate(px,py);mg.rotate(-P.face);
  mg.fillStyle='#7fb7d6';mg.strokeStyle='#0e171b';mg.lineWidth=2;
  mg.beginPath();mg.moveTo(0,11);mg.lineTo(-7,-7);mg.lineTo(7,-7);mg.closePath();mg.fill();mg.stroke();
  mg.restore();
  mg.fillStyle='#8ea4a2';mg.font='500 20px sans-serif';mg.fillText('N',cx-6,24);
}

  +'<h3>O mapa</h3><p>O mapa é grande. No canto tens o minimapa (norte em cima) e, na mochila, a lista de locais com distância, direção e risco. Quanto mais longe, melhor o saque e maior o perigo. Cada cenário tem edifícios só seus. Os edifícios voltam a ter material ao fim de alguns dias, mas com mais zombies lá dentro. Longe do abrigo podes cruzar-te com zombies errantes.</p><h3>Defesas e desenhos</h3><p>Além do taco, da lança, do kit de reforço e da armadilha, há arame farpado, alarme de latas, barril incendiário, holofote, torre de vigia e cerca elétrica. Desbloqueiam-se por nível, por plantas encontradas em edifícios distantes (esquadra, armazém, escola, quinta, oficina) ou experimentando combinações no separador Experimentar da bancada. Os desenhos instalam-se perto das janelas e da porta. O arame, as baterias e a pólvora encontram-se em oficinas, armazéns e garagens.</p><h3>Zombies com mochila</h3><p>Alguns zombies trazem uma mochila laranja. Ao morrerem largam um cubo dourado com materiais (e, raramente, uma planta). Apanha-o passando por cima.</p><h3>Gravar</h3><p>No menu de pausa (Esc ou P) há 3 espaços de gravação no browser. O jogo também grava sozinho a cada amanhecer e quando sais do separador. As gravações ficam neste browser e neste dispositivo.</p><h3>Dificuldade</h3><p>O jogo adapta-se: com mais nível e mais defesas surgem grupos maiores, corredores a partir do dia 6 e colossos a partir do dia 10.</p>'
  +'<div class="foot">'+closeBtn('Entendido')+'</div>';
  openModal(h,{close:function(){if(typeof back==='function'){back();}else{closeModal();}}},typeof back==='function');
}

/* --- fabrico --- */
var CR=null;
var MATS=['madeira','pregos','sucata','fita','arame','bateria','polvora','combustivel','pecas'];
var BASIC=['madeira','pregos','sucata','fita'];
function openCraft(){
  var first=Object.keys(BP).filter(function(k){return S.unl[k];})[0]||'taco';
  CR={bp:first,sel:'madeira',grid:{},msg:null};renderCraft();
}
function craftScore(bp){
  var cells=Object.keys(CR.grid),n=cells.length;
  if(!n)return {s:0,best:0,extra:0,n:0};
  var best=0,dx,dy;
  for(dx=-4;dx<=4;dx++)for(dy=-2;dy<=2;dy++){
    var m=0;bp.pat.forEach(function(p){if(CR.grid[(p.x+dx)+','+(p.y+dy)]===p.t)m++;});
    if(m>best)best=m;
  }
  var extra=n-best;
  var sc=clamp(Math.round(best/bp.pat.length*100-extra*9),0,100);
  return {s:sc,best:best,extra:extra,n:n};
}
function craftChance(sc){return sc>=85?1:clamp(sc/100*1.15,0,1);}
function usedCounts(){var u={};Object.keys(CR.grid).forEach(function(k){var t=CR.grid[k];u[t]=(u[t]||0)+1;});return u;}
function bestLocked(){
  var best={id:null,s:0};
  Object.keys(BP).forEach(function(id){if(S.unl[id])return;var r=craftScore(BP[id]);if(r.s>best.s)best={id:id,s:r.s};});
  return best;
}
function bpDesc(bp){
  if(bp.out==='arma')return 'Dano '+bp.dmg+', '+bp.uses+' usos (valores máximos)';
  if(bp.out==='kit')return 'Reforça uma barricada até +'+bp.hp+' HP';
  if(bp.out==='trap')return bp.charges+' cargas de dano num ponto de entrada';
  return {wire:'Arame com até 70 de resistência: fere quem ataca a barricada',alarm:'Avisa quando algo se aproxima e dá-te tempo ao dormir',barrel:'Explode quando a horda chega e fere todos à volta',fence:'Eletrifica a barricada enquanto o gerador estiver ligado',tower:'Dispara sozinha até 14 virotes; recarrega-se com sucata e tábua',spot:'Atrasa os zombies perto da casa enquanto houver energia'}[bp.def];
}
function renderCraft(){
  var exp=CR.bp==='exp',bp=exp?null:BP[CR.bp];
  var used=usedCounts(),n=Object.keys(CR.grid).length;
  var h='<h2>Bancada de trabalho</h2><p class="dim">Inventa a disposição. A pontuação mostra quão bem a ideia funciona.</p>';
  h+='<div class="tabs">'+Object.keys(BP).map(function(k){
    var un=S.unl[k];
    return '<button type="button" class="tab'+(k===CR.bp?' on':'')+'" data-a="bp" data-v="'+k+'"'+(un?'':' disabled')+'>'+BP[k].n+(un?'':' (nív. '+BP[k].lvl+')')+'</button>';
  }).join('')+'<button type="button" class="tab'+(exp?' on':'')+'" data-a="bp" data-v="exp">Experimentar</button></div>';
  h+='<div class="cr"><div>';
  var known=false,col='var(--warn)',r={s:0,n:n};
  if(exp){
    h+='<p>Combina materiais à vontade. Se a combinação coincidir com uma ideia que ainda não conheces, descobres o desenho. Não gastas nada a experimentar.</p>';
  }else{
    r=craftScore(bp);known=!!S.known[CR.bp];
    col=r.s>=85?'var(--ok)':r.s>=50?'var(--warn)':'var(--bad)';
    h+='<p><b>'+bp.tipo+'</b> · '+bpDesc(bp)+'</p><p class="dim">Dica: '+bp.dica+'</p>';
  }
  h+='<div class="grid">';
  for(var y=0;y<3;y++)for(var x=0;x<5;x++){
    var key=x+','+y,t=CR.grid[key],ghost=null;
    if(known)bp.pat.forEach(function(p){if(p.x===x&&p.y===y)ghost=p.t;});
    if(t){var inf=itemInfo(t);h+='<button type="button" class="cell f" style="background:'+inf.c+'" data-a="cell" data-v="'+key+'">'+inf.s+'</button>';}
    else if(ghost){h+='<button type="button" class="cell g" data-a="cell" data-v="'+key+'">'+itemInfo(ghost).s+'</button>';}
    else h+='<button type="button" class="cell" data-a="cell" data-v="'+key+'" aria-label="Célula vazia"></button>';
  }
  h+='</div>';
  if(exp){
    var bl=bestLocked();
    h+='<p class="dim">'+(!n?'Põe materiais na grelha para experimentar.':bl.s>=80?'Isto faz sentido. Testa a combinação.':bl.s>=60?'Estás muito perto de uma ideia nova.':bl.s>=35?'Sentes que há ali alguma coisa.':'Nada de especial por enquanto.')+'</p>';
  }else{
    var ch=craftChance(r.s);
    h+='<div class="score"><b style="color:'+col+'">'+r.s+'%</b><span class="dim">eficiência · sucesso '+Math.round(ch*100)+'%</span></div><div class="meter"><i style="width:'+r.s+'%;background:'+col+'"></i></div>';
    if(known)h+='<p class="dim">Receita descoberta: as sombras douradas mostram a disposição ideal (pode ser deslocada na grelha).</p>';
  }
  if(CR.msg)h+='<div class="res '+CR.msg.c+'">'+CR.msg.t+'</div>';
  h+='</div><div><div class="pal">';
  var sel=CR.sel;
  Object.keys(TOOLS).forEach(function(k){h+='<button type="button" class="it'+(sel===k?' on':'')+'" data-a="sel" data-v="'+k+'"><span class="sw" style="background:'+TOOLS[k].c+'"></span><span>'+TOOLS[k].n+'</span><b>∞</b></button>';});
  MATS.forEach(function(k){
    if(!(S.inv[k]>0||used[k]||BASIC.indexOf(k)>=0))return;
    var left=S.inv[k]-(used[k]||0);
    h+='<button type="button" class="it'+(sel===k?' on':'')+'" data-a="sel" data-v="'+k+'"'+(left<=0&&sel!==k?' disabled':'')+'><span class="sw" style="background:'+ITEMS[k].c+'"></span><span>'+ITEMS[k].n+'</span><b>'+left+'</b></button>';
  });
  h+='<button type="button" class="it'+(sel==='erase'?' on':'')+'" data-a="sel" data-v="erase"><span>Borracha</span></button>';
  h+='<button type="button" class="it" data-a="clear"><span>Limpar grelha</span></button></div></div></div>';
  h+='<div class="foot"><button class="btn" type="button" data-a="close">Sair</button><button class="btn pri" type="button" data-a="make"'+(n?'':' disabled')+'>'+(exp?'Testar combinação':'Fabricar')+'</button></div>';
  openModal(h,{
    bp:function(v){CR.bp=v;CR.msg=null;renderCraft();},
    sel:function(v){CR.sel=v;renderCraft();},
    clear:function(){CR.grid={};CR.msg=null;renderCraft();},
    cell:function(v){
      var cur=CR.grid[v];
      if(CR.sel==='erase'||cur===CR.sel){delete CR.grid[v];}
      else{
        var left=TOOLS[CR.sel]?1:S.inv[CR.sel]-(usedCounts()[CR.sel]||0);
        if(left>0)CR.grid[v]=CR.sel;
      }
      CR.msg=null;renderCraft();
    },
    make:doCraft,close:closeModal
  });
}
function doCraft(){
  var n=Object.keys(CR.grid).length;if(!n)return;
  if(CR.bp==='exp'){
    var bl=bestLocked();
    if(bl.id&&bl.s>=80){
      unlockBp(bl.id,'descoberto por experimentação');addXp(15);CR.grid={};
      CR.msg={c:'ok',t:'Descobriste um desenho novo: '+BP[bl.id].n+'. Já aparece nos separadores.'};
    }else{CR.msg={c:'bad',t:'Não aconteceu nada de especial. Os materiais ficaram intactos.'};SFX.play('dud');}
    renderCraft();return;
  }
  var bp=BP[CR.bp],r=craftScore(bp),used=usedCounts(),k;
  for(k in used){if(ITEMS[k]&&S.inv[k]<used[k]){CR.msg={c:'bad',t:'Faltam materiais.'};renderCraft();return;}}
  for(k in used){if(ITEMS[k])S.inv[k]-=used[k];}
  S.crafts++;
  var ch=craftChance(r.s),ok=Math.random()<ch;
  CR.grid={};
  if(!ok){
    CR.msg={c:'bad',t:'Falhou. A peça ficou torta e os materiais perderam-se ('+r.s+'%).'};
    SFX.play('craftFail');say('Fabrico falhado ('+r.s+'%). Materiais perdidos.','bad');addXp(2);
  }else{
    var q=0.4+0.6*r.s/100,label=r.s>=85?'Obra-prima':r.s>=60?'Boa':r.s>=35?'Fraca':'Defeituosa';
    if(r.s>=60)S.known[CR.bp]=true;
    if(bp.out==='arma'){
      var uses=Math.max(3,Math.round(bp.uses*q)),dmg=Math.round(bp.dmg*(0.6+0.4*r.s/100)*10)/10;
      if(S.weapons.length>=4){S.weapons.splice(1,1);if(S.eq>=S.weapons.length)S.eq=0;}
      S.weapons.push({n:bp.n+' ('+label+')',dmg:dmg,uses:uses,max:uses});markObj('weaponMade');
      CR.msg={c:'ok',t:bp.n+' ('+label+'): dano '+dmg+', '+uses+' usos. Equipa-a na mochila.'};
    }else if(bp.out==='kit'){
      var hp=Math.round(bp.hp*q);S.kits.push(hp);
      CR.msg={c:'ok',t:'Kit de reforço ('+label+'): +'+hp+' HP numa barricada.'};
    }else if(bp.out==='trap'){
      var c=Math.max(1,Math.round(bp.charges*q));S.traps.push(c);
      CR.msg={c:'ok',t:'Armadilha ('+label+'): '+c+' cargas.'};
    }else{
      var val=bp.def==='wire'?Math.round(70*q):bp.def==='tower'?Math.max(4,Math.round(14*q)):q;
      S.def[bp.def].push(val);
      CR.msg={c:'ok',t:bp.n+' ('+label+') pronto'+(bp.def==='wire'?': '+val+' de resistência':bp.def==='tower'?': '+val+' disparos':'')+'. Instala-o no ponto certo do abrigo.'};
    }
    SFX.play('craftOk');say('Fabricaste: '+bp.n+' ('+r.s+'%).','ok');addXp(Math.round(8+r.s/10));
  }
  renderCraft();
}

/* --- minijogo de fiação --- */
var WR=null;
function openWire(dev,custom){
  var cost=custom?0:DEV[dev].cost;
  if(S.inv.pecas<cost){toast('Faltam peças eletrónicas ('+cost+').');return;}
  var n=clamp(3+Math.floor(S.lvl/2),3,6);
  var cols=shuffle(WIRES.slice()).slice(0,n);
  WR={dev:dev,cols:cols,right:shuffle(cols.slice()),sel:-1,done:{},rdone:{},err:0,cost:cost,state:'play',msg:'',custom:custom||null};
  renderWire();
}
function renderWire(){
  var n=WR.cols.length,H=n*54+20,svg='<svg class="wsvg" viewBox="0 0 360 '+H+'" role="group" aria-label="Quadro de ligações">';
  var i,j;
  for(i=0;i<n;i++){
    var y=34+i*54,c=WR.cols[i];
    var isSel=WR.sel===i,done=WR.done[i]!==undefined;
    svg+='<g data-a="wl" data-v="'+i+'"><rect x="0" y="'+(y-26)+'" width="140" height="52" fill="transparent"/>'
      +'<line x1="100" y1="'+y+'" x2="132" y2="'+y+'" stroke="'+c.c+'" stroke-width="'+(isSel?9:6)+'" stroke-linecap="round"/>'
      +'<circle cx="28" cy="'+y+'" r="13" fill="'+c.c+'" stroke="'+(isSel?'#e8b95c':'#0a1216')+'" stroke-width="3"/>'
      +'<text x="50" y="'+(y+5)+'" fill="#dce6e0" font-size="14" font-family="sans-serif">'+c.n+'</text></g>';
    if(done){
      var jy=34+WR.done[i]*54;
      svg+='<line x1="132" y1="'+y+'" x2="228" y2="'+jy+'" stroke="'+c.c+'" stroke-width="6" stroke-linecap="round"/>';
    }
  }
  for(j=0;j<n;j++){
    var yy=34+j*54,cc=WR.right[j],rd=WR.rdone[j];
    svg+='<g data-a="wr" data-v="'+j+'"><rect x="220" y="'+(yy-26)+'" width="140" height="52" fill="transparent"/>'
      +'<line x1="228" y1="'+yy+'" x2="260" y2="'+yy+'" stroke="'+cc.c+'" stroke-width="6" stroke-linecap="round"/>'
      +'<circle cx="332" cy="'+yy+'" r="13" fill="'+cc.c+'" stroke="'+(rd?'#6fcf9a':'#0a1216')+'" stroke-width="3"/>'
      +'<text x="312" y="'+(yy+5)+'" fill="#dce6e0" font-size="14" text-anchor="end" font-family="sans-serif">'+cc.n+'</text></g>';
  }
  svg+='</svg>';
  var h='<h2>Quadro elétrico: '+(WR.custom?WR.custom.nome:DEV[WR.dev].n)+'</h2><p class="dim">Liga cada fio ao conector da mesma cor. Três erros queimam uma peça.</p>'+svg;
  h+='<p class="dim">Erros: <b>'+WR.err+'/3</b>'+(WR.msg?' · '+WR.msg:'')+'</p>';
  if(WR.state==='won')h+='<div class="res ok">'+(WR.custom?'Circuito ligado. '+WR.custom.nome+' instalada.':'Circuito ligado. '+DEV[WR.dev].n+' reparado.')+'</div><div class="foot">'+closeBtn('Continuar')+'</div>';
  else if(WR.state==='lost')h+='<div class="res bad">'+(WR.custom?'Curto-circuito. A instalação falhou e o material ficou intacto.':'Curto-circuito. Perdeste uma peça eletrónica.')+'</div><div class="foot">'+closeBtn('Fechar')+'</div>';
  else h+='<div class="foot"><button class="btn" type="button" data-a="close">Desistir</button></div>';
  openModal(h,{
    wl:function(v){if(WR.state!=='play')return;v=+v;if(WR.done[v]!==undefined)return;WR.sel=WR.sel===v?-1:v;WR.msg='';renderWire();},
    wr:function(v){
      if(WR.state!=='play'||WR.sel<0)return;v=+v;if(WR.rdone[v])return;
      if(WR.right[v].k===WR.cols[WR.sel].k){
        WR.done[WR.sel]=v;WR.rdone[v]=true;WR.sel=-1;WR.msg='Ligação certa.';SFX.play('wireOk');
        if(Object.keys(WR.done).length===WR.cols.length){
          WR.state='won';SFX.play('wireWin');
          if(WR.custom){WR.custom.onWin();addXp(15);}
          else{S.inv.pecas-=WR.cost;S.dev[WR.dev].ok=true;addXp(20);say(DEV[WR.dev].n+' reparado.','ok');}
        }
      }else{
        WR.err++;WR.sel=-1;S.hp-=3;WR.msg='Faíscas! -3 de saúde.';SFX.play('wireErr');
        if(WR.err>=3){WR.state='lost';SFX.play('wireLose');if(!WR.custom){S.inv.pecas=Math.max(0,S.inv.pecas-1);say('Curto-circuito: perdeste uma peça.','bad');}else say('Curto-circuito: a instalação falhou.','bad');}
        if(S.hp<=0){gameOver();return;}
      }
      renderWire();
    },
    close:closeModal
  });
}

/* --- incursões --- */
var RD=null;
function openRaid(id){
  if(alive()>0){toast('Há zombies por perto.');return;}
  SFX.play('door');RD={id:id,enc:null,msg:[]};S.raids++;renderRaid();
}
function rollLoot(room,mult){
  var table=ROOMS[room],got={},any=false;
  Object.keys(table).forEach(function(k){
    var e=table[k],p=e[0]*(k==='pecas'?S.sc.techMul:1);
    if(Math.random()<p){var q=Math.max(1,Math.round(randi(e[1],e[2])*S.sc.lootMul*mult));got[k]=q;any=true;}
  });
  if(!any){var k0=pick(Object.keys(table));got[k0]=Math.max(1,Math.round(table[k0][1]*mult));}
  return got;
}
function giveLoot(room,mult,i){
  var got=rollLoot(room,mult),parts=[];
  Object.keys(got).forEach(function(k){S.inv[k]+=got[k];parts.push('+'+got[k]+' '+ITEMS[k].s.toLowerCase());});
  var rm=S.bld[RD.id].rooms[i];rm.done=true;rm.at=S.min;markObj('raided');addXp(6);
  RD.msg=[room+': '+parts.join(', ')+'.'];SFX.play('pickup');
  var pl=BLD[RD.id].plant;
  var restLeft=S.bld[RD.id].rooms.filter(function(r){return !r.done;}).length;
  if(pl&&!S.unl[pl]&&(restLeft===0||Math.random()<0.4)){unlockBp(pl,'planta encontrada em '+BLD[RD.id].nome);RD.msg.push('Entre os papéis encontras a planta de «'+BP[pl].n+'».');}
  say('Vasculhaste: '+room+' ('+parts.join(', ')+').','ok');
}
function renderRaid(){
  var b=BLD[RD.id],rooms=S.bld[RD.id].rooms,h=hourOf();
  var html='<h2>'+esc(b.nome)+'</h2><p class="dim">'+p2(Math.floor(h))+':'+p2(Math.floor((h%1)*60))+' · '+phaseName(h)+(isNight(h)?' · à noite o risco sobe':'')+'</p><p><span class="pill">Risco: '+riskName(b)+'</span> <span class="pill">Infestação: nível '+S.bld[RD.id].lvl+'</span></p>';
  if(RD.enc){
    var K=ZK[RD.enc.kind];
    html+='<div class="res bad"><b>'+K.n+'!</b> Ouviu-te a remexer e vem direito a ti.</div><div class="foot"><button class="btn" type="button" data-a="flee">Fugir (perdes o saque)</button><button class="btn pri" type="button" data-a="fight">Lutar com '+esc(curWeapon().n)+'</button></div>';
  }else{
    html+='<div class="rooms">'+rooms.map(function(r,i){
      return '<div class="room'+(r.done?' done':'')+'"><span class="rn">'+r.n+'</span>'+(r.done?'<span class="pill">vasculhada</span>':'<button class="btn pri" type="button" data-a="search" data-v="'+i+'">Vasculhar · ~30 min</button>')+'</div>';
    }).join('')+'</div>';
    if(RD.msg.length)html+='<div class="res ok">'+RD.msg.map(esc).join('<br>')+'</div>';
    var recent=S.log.slice(-2).filter(function(l){return l.c==='bad'||l.c==='warn';});
    if(recent.length)html+='<div class="res bad">'+recent.map(function(l){return esc(l.m);}).join('<br>')+'</div>';
    html+='<div class="foot"><button class="btn" type="button" data-a="close">Voltar ao abrigo</button></div>';
  }
  openModal(html,{
    close:closeModal,
    search:function(v){
      v=+v;var room=rooms[v];if(room.done)return;
      SFX.play('rummage');advanceMinutes(randi(25,40),{raid:true});
      if(S.hp<=0)return;
      S.ene=clamp(S.ene-3,0,100);
      var hh=hourOf();
      var ch=bDanger(b)*noiseMul()*(isNight(hh)?1.7:1)*((moonActive()||fogActive())?1.4:1);
      if(Math.random()<ch){RD.enc={room:v,kind:pickKind()};SFX.play('stinger');SFX.play('groan',{kind:RD.enc.kind});RD.msg=[];}
      else giveLoot(room.n,1,v);
      renderRaid();
    },
    fight:function(){
      var w=curWeapon(),k=RD.enc.kind,room=rooms[RD.enc.room];
      var p=clamp(0.3+w.dmg*0.13-(k==='brute'?0.15:0)-(k==='runner'?0.05:0),0.2,0.92);
      if(Math.random()<p){
        S.kills++;addXp(10);if(!w.fists){w.uses-=3;if(w.uses<=0){S.weapons.splice(S.eq,1);S.eq=0;}}
        SFX.play('hit');SFX.play('kill',{kind:k});say(ZK[k].n+' abatido na incursão.','ok');giveLoot(room.n,1,RD.enc.room);
        var cl=rollCarry(k,b.cx,b.cz);if(cl)RD.msg.push('Revistas o zombie: '+applyLoot(cl)+'.');
        RD.enc=null;
      }else{
        var dmg=Math.round(randi(10,24)*(k==='brute'?1.5:1));S.hp-=dmg;

/* --- gravar e carregar (localStorage) --- */
var SKEY='suburbio-morto-save-v1',memStore=null,memOnly=false;
function readStore(){
  if(memOnly&&memStore)return memStore;
  try{var r=window.localStorage.getItem(SKEY);if(r){var o=JSON.parse(r);if(o&&o.slots)return o;}}catch(e){}
  return memStore||{slots:{}};
}
function writeStore(o){
  try{window.localStorage.setItem(SKEY,JSON.stringify(o));memOnly=false;memStore=o;return true;}
  catch(e){memStore=o;memOnly=true;return false;}
}
function snapshot(){
  var o=Object.assign({},S);delete o.sc;
  o.weapons=S.weapons.map(function(w){var c=Object.assign({},w);if(w.fists)c.uses=0;return c;});
  return {v:1,sc:S.sc.id,t:Date.now(),px:P.x,pz:P.z,pf:P.face,cy:cam.yaw,cd:cam.dist,
    s:JSON.parse(JSON.stringify(o)),
    z:zombies.filter(function(z){return !z.dead;}).map(function(z){return {k:z.kind,x:z.x,z:z.z,hp:z.hp,l:z.loot||null};})};
}
function saveSlot(id){var o=readStore();o.slots[id]=snapshot();return writeStore(o);}
function autoSave(){if(inGame&&S&&!S.over&&S.hp>0)saveSlot('auto');}
function loadSnap(d){
  try{
    var sc=SCEN[d&&d.sc];if(!sc||d.v!==1||!d.s)return false;
    BLD=makeBuildings(sc);
    var st=newState(sc);
    Object.keys(d.s).forEach(function(k){st[k]=d.s[k];});
    if(!d.s.obj){var dd={};OBJ.forEach(function(o){dd[o.id]=1;});st.obj={fin:1,d:dd};}
    st.sc=sc;st.over=false;ensureDefs(st);
    if(!st.bld||st.bld.length!==BLD.length||st.hp<=0)return false;
    st.weapons.forEach(function(w){if(w.fists)w.uses=Infinity;});
    zombies.forEach(function(z){scene.remove(z.mesh);});zombies=[];
    fxList.forEach(function(f){scene.remove(f.m);});fxList=[];clearDrops();
    S=st;buildWorld(sc);
    P.x=d.px;P.z=d.pz;P.face=d.pf;P.tx=null;cam.yaw=d.cy;cam.dist=d.cd;
    (d.z||[]).forEach(function(q){var z=makeZombie(q.k,q.x,q.z,q.l||null);z.hp=q.hp;zombies.push(z);});
    ctxSig='';invSig='';locSig='';
    $('#hud').hidden=false;inGame=true;
    checkUnlocks();closeModal();renderLog();updateHud();
    say('Jogo carregado.','ok');
    return true;
  }catch(e){return false;}
}
function slotInfo(d){
  var sc=SCEN[d.sc];if(!sc||!d.s)return 'Gravação inválida';
  var h=(d.s.min%1440)/60,when='';
  try{when=new Date(d.t).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){}
  return esc(sc.nome)+' · Dia '+d.s.day+' · '+p2(Math.floor(h))+':'+p2(Math.floor((h%1)*60))+' · Nível '+d.s.lvl+(when?' · '+esc(when):'');
}
function openSaves(canSave,back){
  var sv={pend:null,msg:'',bad:false};
  function btn(a,id,label,pendLabel){
    var on=sv.pend===a+':'+id;
    return '<button class="btn'+(on?' pri':'')+'" type="button" data-a="'+a+'" data-v="'+id+'">'+(on?pendLabel:label)+'</button>';
  }
  function draw(){
    var o=readStore(),h='<h2>Gravações</h2><p class="dim">Ficam guardadas neste browser, neste dispositivo.</p><div class="rooms">';
    ['auto',1,2,3].forEach(function(id){
      var d=o.slots[id],name=id==='auto'?'Gravação automática':'Espaço '+id,b='';
      if(canSave&&id!=='auto')b+=btn('save',id,'Gravar','Substituir?');
      if(d)b+=btn('load',id,'Carregar',canSave?'Perder o progresso atual?':'Carregar')+btn('del',id,'Apagar','Apagar?');
      h+='<div class="room" style="flex-wrap:wrap"><div style="min-width:0"><span class="rn">'+name+'</span><br><span class="dim">'+(d?slotInfo(d):'Vazio')+'</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">'+b+'</div></div>';
    });
    h+='</div>';
    if(sv.msg)h+='<div class="res '+(sv.bad?'bad':'ok')+'">'+esc(sv.msg)+'</div>';
    h+='<div class="foot"><button class="btn pri" type="button" data-a="back">Voltar</button></div>';
    openModal(h,{
      back:function(){back();},
      save:function(v){
        var d=readStore().slots[v];
        if(d&&sv.pend!=='save:'+v){sv.pend='save:'+v;sv.msg='';draw();return;}
        var ok=saveSlot(v);sv.pend=null;sv.bad=!ok;
        sv.msg=ok?'Jogo gravado no espaço '+v+'.':'Gravado só para esta sessão: o browser bloqueia o armazenamento. Perde-se ao fechar a página.';
        draw();
      },
      load:function(v){
        var d=readStore().slots[v];if(!d)return;
        if(canSave&&sv.pend!=='load:'+v){sv.pend='load:'+v;sv.msg='';draw();return;}
        if(!loadSnap(d)){sv.pend=null;sv.bad=true;sv.msg='Não foi possível carregar esta gravação.';draw();}
      },
      del:function(v){
        if(sv.pend!=='del:'+v){sv.pend='del:'+v;sv.msg='';draw();return;}
        var o2=readStore();delete o2.slots[v];writeStore(o2);sv.pend=null;sv.bad=false;sv.msg='Gravação apagada.';draw();
      }
    },true);
  }
  draw();
}

/* ---------- ambiente por frame ---------- */
function applyEnv(dt){
  var h=hourOf(),df=h>=6&&h<=18?clamp(Math.sin((h-6)/12*Math.PI)*1.3+0.05,0,1):0;
  var night=isNight(h),moonOn=moonActive(),fog=fogActive();
  var sky=skyAt(h);
  tmpA.copy(sky);
  if(fog)tmpA.lerp(tmpB.setHex(night?0x33383b:0xb7bcbd),0.75);
  scene.background.copy(tmpA);scene.fog.color.copy(tmpA);
  var dens=fog?0.055:(night?0.02:0.011);
  scene.fog.density=lerp(scene.fog.density,dens,Math.min(1,dt*1.2));
  if(df>0.05){
    sun.color.setHex(0xfff0d6).lerp(tmpB.setHex(0xff9a62),clamp(1-df*1.6,0,1));
    sun.intensity=0.2+0.9*df;
    var ang=(h-6)/12*Math.PI;
    sun.position.set(P.x-Math.cos(ang)*22,Math.max(6,Math.sin(ang)*28),P.z+8);
  }else{
    sun.color.setHex(0x9db4ff);sun.intensity=moonOn?0.6:0.22;
    sun.position.set(P.x-10,22,P.z-9);
  }
  sun.target.position.set(P.x,0,P.z);
  hemi.intensity=0.22+0.5*df+(moonOn?0.18:0);
  hemi.color.setHex(df>0.05?0xbfd8ff:0x6f86c8);
  torch.position.set(P.x,3,P.z+0.5);
  torch.intensity=night||fog?0.9:0;
  var lampOn=S.dev.light.ok&&powered();
  lampL.intensity=lampOn?(S.spot?2.6:1.3):0;
  if(devMesh.light)devMesh.light.material.color.setHex(lampOn?0xffe9b0:0x4a4a44);
  if(devMesh.gen)devMesh.gen.material.color.setHex(powered()?0x6fff9a:S.dev.gen.ok?0xe0624f:0x552222);
  if(devMesh.radio)devMesh.radio.material.color.setHex(S.dev.radio.ok&&powered()?0x4a6a55:0x30363a);
  SIDEKEYS.forEach(function(k){var g=barMeshes[k];if(g&&S.bar[k].fence){var on=powered();g.userData.fence.userData.lines.forEach(function(l){l.material.color.setHex(on?0x6fd0ff:0x37505c);});}});
  moon.visible=moonOn;
  moon.position.set(P.x-50,48,P.z-80);
  if(roofG)roofG.visible=!playerInside();
  labels.forEach(function(l){l.visible=Math.hypot(l.userData.bx-P.x,l.userData.bz-P.z)<(fog?24:75);});
  var t=performance.now()/500;
  markers.forEach(function(m,i){m.position.y=m.userData.base+Math.sin(t+i)*0.12;m.rotation.y=t;});
  var home=world.children.filter(function(c){return c.userData&&c.userData.home;})[0];
  if(home)home.visible=!playerInside()&&Math.hypot(P.x,P.z)>7;
}
function updateCamera(dt){
  if(keys.q)cam.yaw-=1.6*dt;if(keys.r)cam.yaw+=1.6*dt;
  var cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  var tx=P.x+Math.sin(cam.yaw)*cam.dist*cp,ty=cam.dist*sp,tz=P.z+Math.cos(cam.yaw)*cam.dist*cp;
  camera.position.x=lerp(camera.position.x,tx,Math.min(1,dt*8));
  camera.position.y=lerp(camera.position.y,ty,Math.min(1,dt*8));
  camera.position.z=lerp(camera.position.z,tz,Math.min(1,dt*8));
  camera.lookAt(P.x,0.8,P.z);
}

/* ---------- ciclo principal ---------- */
var last=performance.now(),hudT=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(S&&world){
    if(!paused&&!S.over){
      var sp=alive()>0?1:S.speed,gm=dt*2*sp;
      S.min+=gm;survival(gm);syncDay();directorStep(null);
      S.atkCd=Math.max(0,S.atkCd-dt);S.hurt=Math.max(0,S.hurt-dt);
      movePlayer(dt);updateZombies(dt);wanderSpawn(dt);towerStep(dt);dropsStep(dt);
      if(S.hp<=0)gameOver();
    }
    for(var i=fxList.length-1;i>=0;i--){
      var f=fxList[i];f.t+=dt;f.m.scale.setScalar(1+f.t*4);f.m.material.opacity=Math.max(0,.85-f.t*3);
      if(f.t>.3){scene.remove(f.m);fxList.splice(i,1);}
    }
    applyEnv(dt);updateCamera(dt);
    var hrNow=Math.floor(hourOf());if(lastHr===5&&hrNow===6&&!paused&&inGame)SFX.play('dawn');lastHr=hrNow;
    SFX.update({night:nightAmt(),fog:fogActive(),moon:moonActive(),gen:powered(),threat:Math.min(1,alive()/5),hp:S.hp/100,paused:paused||!inGame,inside:playerInside()},dt);
    hudT+=dt;if(hudT>0.12){hudT=0;updateHud();}
    $('#hud').style.boxShadow=S.hurt>0?'inset 0 0 90px rgba(224,98,79,.55)':'none';
  }
  renderer.render(scene,camera);
}
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(!resize.did){resize.did=1;if(camera.aspect<0.8)cam.dist=Math.max(cam.dist,20);}
}
window.addEventListener('resize',resize);resize();

/* ---------- entradas ---------- */
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  SFX.ensure();
  if(k==='m'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey){SFX.toggleMute();syncSndBtn();if(S&&inGame)say(SFX.cfg.mute?'Som desligado.':'Som ligado.');return;}
  if(!modalEl.hidden){if(k==='escape'&&!modalLock)closeModal();return;}
  if(!S)return;
  if((k==='escape'||k==='p')&&!e.repeat){openPause();return;}
  keys[k]=true;
  if(k===' '||k==='spacebar'){e.preventDefault();attack();}
  else if(k==='e'&&!e.repeat){doFirstAction();}
  else if(k==='i'&&!e.repeat){invEl.classList.toggle('hide');}
  if(k.indexOf('arrow')===0)e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
window.addEventListener('blur',function(){keys={};});
canvas.addEventListener('wheel',function(e){e.preventDefault();cam.dist=clamp(cam.dist+e.deltaY*0.01,9,30);},{passive:false});
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),gplane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
function moveTo(e){
  var r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  if(ray.ray.intersectPlane(gplane,hit)){
    var tx=clamp(hit.x,-MAPR,MAPR),tz=clamp(hit.z,-MAPR,MAPR);
    if(!collides(tx,tz,0.35)){P.tx=tx;P.tz=tz;}
  }
}
/* toque: tocar anda, arrastar roda a câmara, dois dedos aproximam/afastam; rato: clicar anda */
var tp={ids:{},n:0,x0:0,y0:0,moved:false,d0:0,c0:0};
function tpDist(){var k=Object.keys(tp.ids);if(k.length<2)return 0;var a=tp.ids[k[0]],b=tp.ids[k[1]];return Math.hypot(a.x-b.x,a.y-b.y);}
canvas.addEventListener('pointerdown',function(e){
  if(!S||paused||S.over)return;
  if(e.pointerType!=='touch'){moveTo(e);return;}
  tp.ids[e.pointerId]={x:e.clientX,y:e.clientY};tp.n=Object.keys(tp.ids).length;
  if(tp.n===1){tp.x0=e.clientX;tp.y0=e.clientY;tp.moved=false;}
  else if(tp.n===2){tp.moved=true;tp.d0=tpDist();tp.c0=cam.dist;}
  try{canvas.setPointerCapture(e.pointerId);}catch(er){}
});
canvas.addEventListener('pointermove',function(e){
  var t=tp.ids[e.pointerId];if(!t||e.pointerType!=='touch')return;
  if(tp.n===2){t.x=e.clientX;t.y=e.clientY;var d=tpDist();if(tp.d0>10&&d>10)cam.dist=clamp(tp.c0*tp.d0/d,9,30);return;}
  var dx=e.clientX-t.x;t.x=e.clientX;t.y=e.clientY;
  if(!tp.moved&&Math.hypot(e.clientX-tp.x0,e.clientY-tp.y0)>12)tp.moved=true;
  if(tp.moved)cam.yaw-=dx*0.008;
});
function tpEnd(e){
  if(e.pointerType!=='touch'||!tp.ids[e.pointerId])return;
  var was=tp.n;delete tp.ids[e.pointerId];tp.n=Object.keys(tp.ids).length;
  if(was===1&&!tp.moved&&e.type==='pointerup'&&S&&!paused&&!S.over)moveTo(e);
}
canvas.addEventListener('pointerup',tpEnd);canvas.addEventListener('pointercancel',tpEnd);
var joyEl=$('#joy'),knob=$('#knob'),joyId=null;
function joyMove(e){
  var r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2),m=Math.hypot(dx,dy);
  if(m>1){dx/=m;dy/=m;}
  joy.x=Math.abs(dx)<0.12?0:dx;joy.y=Math.abs(dy)<0.12?0:dy;
  knob.style.transform='translate('+dx*36+'px,'+dy*36+'px)';
}
joyEl.addEventListener('pointerdown',function(e){joyId=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault();});
joyEl.addEventListener('pointermove',function(e){if(e.pointerId===joyId)joyMove(e);});
function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;joy.x=0;joy.y=0;knob.style.transform='';}
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);

/* som: desbloqueio do áudio, cliques, regulação de volume */
['pointerdown','touchstart'].forEach(function(ev){window.addEventListener(ev,function(){SFX.ensure();},{capture:true,passive:true});});
document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('button'):null;if(b&&!b.disabled&&!b.hasAttribute('data-nosound'))SFX.play('ui');},true);
document.addEventListener('visibilitychange',function(){SFX.hold(document.hidden);});
mb.addEventListener('input',function(e){
  var t=e.target,k=t&&t.dataset?t.dataset.k:null;if(!k)return;
  SFX.setLevel(k,(+t.value)/100);
  var lab=t.parentNode&&t.parentNode.querySelector?t.parentNode.querySelector('b'):null;if(lab)lab.textContent=String(Math.round(+t.value));
});
mb.addEventListener('change',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.k)SFX.play('pickup');});

/* pré-visualização do cenário atrás do ecrã inicial */
BLD=makeBuildings(SCEN.suburbio);S=newState(SCEN.suburbio);buildWorld(SCEN.suburbio);
P.x=0;P.z=0.5;cam.yaw=0.5;
camera.position.set(8,14,14);
openStart();
requestAnimationFrame(frame);
})();
